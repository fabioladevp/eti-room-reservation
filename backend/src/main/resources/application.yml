spring:
  application:
    name: eti-room-reservation
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eti_rooms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lome}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Africa/Lome
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    time-zone: Africa/Lome

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt-secret: ${JWT_SECRET:change-this-demo-secret-with-at-least-32-characters}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:no-reply@eti.local}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when_authorized
  health.mail.enabled: false

logging:
  level:
    org.springframework.security: INFO
